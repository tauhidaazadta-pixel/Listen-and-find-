<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Listen & Find - Real Sounds</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --text: #2d3436;
      --purple: #6c5ce7;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--text);
    }

    /* --- SCREENS --- */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* --- START SCREEN --- */
    #startScreen { text-align: center; }
    .title {
      font-family: 'Baloo 2', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 3px 3px 0 #6c5ce7, 6px 6px 0 rgba(0,0,0,0.1);
      margin-bottom: 10px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 1.2rem;
      color: #fff;
      font-weight: 900;
      margin-bottom: 30px;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    }
    .big-btn {
      background: linear-gradient(to bottom, #00b894, #00cec9);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 20px 50px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 8px 0 #008f72;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .big-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 #008f72; }

    /* --- GAME SCREEN --- */
    #gameScreen {
      justify-content: flex-start;
      padding-top: 20px;
      overflow-y: auto;
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    
    .score-box {
      font-family: 'Baloo 2', cursive;
      font-size: 1.4rem;
      color: var(--purple);
      background: rgba(255,255,255,0.9);
      padding: 8px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    /* Big Speaker Button Area */
    .speaker-area {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }

    .question-text {
      font-family: 'Baloo 2', cursive;
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
      margin-bottom: 15px;
      text-align: center;
    }

    .play-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid #a29bfe;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s;
      animation: pulse-ring 2s infinite;
    }
    .play-btn:active { transform: scale(0.9); }
    .play-btn.playing { animation: shake 0.5s; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(162, 155, 254, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(162, 155, 254, 0); }
      100% { box-shadow: 0 0 0 0 rgba(162, 155, 254, 0); }
    }
    @keyframes shake {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    /* Options Area */
    .options-area {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .opt-btn {
      background: #fff;
      border: 4px solid #fff;
      border-radius: 20px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 0 #dfe6e9;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .opt-btn:active { 
      transform: translateY(8px); 
      box-shadow: 0 0px 0 #dfe6e9; 
    }

    .opt-emoji { font-size: 3.5rem; margin-bottom: 5px; }
    .opt-name { font-size: 0.9rem; font-weight: 900; color: var(--purple); }

    .opt-btn.correct {
      background: #d4edda;
      border-color: #00b894;
      box-shadow: 0 8px 0 #00b894;
      animation: pop 0.4s ease;
    }
    .opt-btn.wrong {
      background: #f8d7da;
      border-color: #dc3545;
      box-shadow: 0 8px 0 #dc3545;
      animation: shake 0.4s ease;
    }

    @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }

    /* Confetti */
    .confetti {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 9999;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* --- WIN SCREEN --- */
    #winScreen h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 2px 2px 0 #00b894, 4px 4px 0 rgba(0,0,0,0.1);
      margin-bottom: 10px;
    }
    .star-icon {
      font-size: 6rem;
      animation: bounce 1s infinite alternate;
      margin: 20px 0;
    }

  </style>
</head>
<body>

  <!-- 1. START SCREEN -->
  <div id="startScreen" class="screen active">
    <h1 class="title">Listen<br>& Find</h1>
    <p class="subtitle">आवाज़ सुनो और सही चुनो! 👂</p>
    <button class="big-btn" onclick="startGame()">शुरू करें</button>
  </div>

  <!-- 2. GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="header">
      <div class="score-box">Score: <span id="score">0</span></div>
      <div class="score-box">Round: <span id="round">1</span>/10</div>
    </div>

    <div class="speaker-area">
      <div class="question-text">सुनो और पहचानो (Listen!)</div>
      <button class="play-btn" id="playBtn" onclick="playCurrentSound()">🔊</button>
    </div>

    <div class="options-area" id="optionsArea">
      <!-- Options will be generated here -->
    </div>
  </div>

  <!-- 3. WIN SCREEN -->
  <div id="winScreen" class="screen">
    <h1 class="title">शाबाश!</h1>
    <div class="star-icon">🎧</div>
    <p class="subtitle" id="winText">तुमने सारी आवाज़ें पहचान लीं!</p>
    <button class="big-btn" onclick="startGame()" style="margin-top: 20px;">फिर से खेलें 🔄</button>
  </div>

  <script>
    /* =========================================================
       1. DATA & STATE (High-Quality Real MP3 Sounds)
       ========================================================= */
    const ITEM_POOL = [
      { id: 'dog', icon: '🐶', name: 'Dog', url: 'https://assets.mixkit.co/active_storage/sfx/219/219-preview.mp3', text: 'Woof Woof' },
      { id: 'cat', icon: '🐱', name: 'Cat', url: 'https://assets.mixkit.co/active_storage/sfx/220/220-preview.mp3', text: 'Meow' },
      { id: 'cow', icon: '🐮', name: 'Cow', url: 'https://assets.mixkit.co/active_storage/sfx/221/221-preview.mp3', text: 'Moo' },
      { id: 'lion', icon: '🦁', name: 'Lion', url: 'https://assets.mixkit.co/active_storage/sfx/224/224-preview.mp3', text: 'Roar' },
      { id: 'elephant', icon: '🐘', name: 'Elephant', url: 'https://assets.mixkit.co/active_storage/sfx/222/222-preview.mp3', text: 'Trumpet' },
      { id: 'duck', icon: '🦆', name: 'Duck', url: 'https://assets.mixkit.co/active_storage/sfx/223/223-preview.mp3', text: 'Quack Quack' },
      { id: 'car', icon: '🚗', name: 'Car', url: 'https://assets.mixkit.co/active_storage/sfx/2609/2609-preview.mp3', text: 'Vroom Vroom' },
      { id: 'train', icon: '🚂', name: 'Train', url: 'https://assets.mixkit.co/active_storage/sfx/2644/2644-preview.mp3', text: 'Choo Choo' },
      { id: 'police', icon: '🚓', name: 'Police Car', url: 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3', text: 'Wee-oo Wee-oo' },
      { id: 'bell', icon: '🚲', name: 'Bicycle', url: 'https://assets.mixkit.co/active_storage/sfx/2559/2559-preview.mp3', text: 'Ring Ring' }
    ];

    let score = 0;
    let round = 1;
    const MAX_ROUNDS = 10;
    let isAnswering = false;
    let currentCorrectItem = null;
    let currentAudio = null;
    let audioUnlocked = false;

    const optionsArea = document.getElementById('optionsArea');
    const scoreEl = document.getElementById('score');
    const roundEl = document.getElementById('round');
    const playBtn = document.getElementById('playBtn');
    
    const screens = {
      start: document.getElementById('startScreen'),
      game: document.getElementById('gameScreen'),
      win: document.getElementById('winScreen')
    };

    /* =========================================================
       2. REAL AUDIO & SPEECH ENGINE
       ========================================================= */
    
    // Unlock audio system on first click (Required for Mobile Browsers like Edge)
    function unlockAudio() {
      if (audioUnlocked) return;
      // Create a silent empty audio to unlock the audio channel
      const silentAudio = new Audio("data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA");
      silentAudio.play().then(() => {
        audioUnlocked = true;
        console.log("Audio unlocked!");
      }).catch(e => console.log("Audio unlock failed, but will try direct play."));
    }

    function playSound(item) {
      if (!item) return;

      // 1. Play Real Audio File
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      
      currentAudio = new Audio(item.url);
      currentAudio.volume = 1.0; 
      
      // Attempt to play. Mobile browsers might block if not unlocked.
      currentAudio.play().catch(e => {
        console.log("Audio play error:", e);
      });
      
      // Visual feedback
      playBtn.classList.add('playing');
      setTimeout(() => playBtn.classList.remove('playing'), 600);

      // 2. Speak the sound word (Text-to-Speech)
      speak(item.text);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-US';
      utt.rate = 0.9;
      utt.volume = 1.0;
      
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Samantha')));
      if (preferred) utt.voice = preferred;
      
      speechSynthesis.speak(utt);
    }

    // UI Sounds
    function sfxCorrect() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    }
    
    function sfxWrong() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }

    /* =========================================================
       3. GAME LOGIC
       ========================================================= */
    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startGame() {
      // Unlock audio on user gesture
      unlockAudio();
      
      score = 0;
      round = 1;
      isAnswering = false;
      scoreEl.textContent = score;
      
      showScreen('game');
      loadRound();
    }

    function loadRound() {
      if (round > MAX_ROUNDS) {
        winGame();
        return;
      }

      roundEl.textContent = round;
      isAnswering = false;

      // Pick 1 correct item and 2 wrong items
      const shuffledItems = shuffle([...ITEM_POOL]);
      currentCorrectItem = shuffledItems[0];
      const wrongItems = [shuffledItems[1], shuffledItems[2]];
      
      const options = shuffle([currentCorrectItem, ...wrongItems]);

      // Render Options
      optionsArea.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `
          <span class="opt-emoji">${opt.icon}</span>
          <span class="opt-name">${opt.name}</span>
        `;
        btn.onclick = () => handleAnswer(btn, opt.id);
        optionsArea.appendChild(btn);
      });

      // Auto-play sound after a slight delay
      setTimeout(() => {
        playSound(currentCorrectItem);
      }, 600);
    }

    function playCurrentSound() {
      unlockAudio();
      if (currentCorrectItem) {
        playSound(currentCorrectItem);
      }
    }

    function handleAnswer(btn, selectedId) {
      if (isAnswering) return;

      if (selectedId === currentCorrectItem.id) {
        // CORRECT
        isAnswering = true;
        btn.classList.add('correct');
        sfxCorrect();
        score += 10;
        scoreEl.textContent = score;

        playSound(currentCorrectItem);
        createConfetti(15);

        setTimeout(() => {
          round++;
          loadRound();
        }, 2200);

      } else {
        // WRONG
        sfxWrong();
        btn.classList.add('wrong');
        
        setTimeout(() => {
          btn.classList.remove('wrong');
        }, 400);
      }
    }

    function winGame() {
      showScreen('win');
      speak("Amazing! You have super ears!");
      createConfetti(60);
    }

    /* =========================================================
       4. VISUAL EFFECTS
       ========================================================= */
    function createConfetti(count = 40) {
      const icons = ['⭐', '🌟', '✨', '🎈', '🎉', '🎵'];
      for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = icons[Math.floor(Math.random() * icons.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-50px';
        c.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        c.style.fontSize = (Math.random() * 20 + 20) + 'px';
        
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }

    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
